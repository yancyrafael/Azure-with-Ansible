name: Deploy with Terraform and Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: Create Infrastructure
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_AD_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_AD_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_AD_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    outputs:
      vm_ip: ${{ steps.get_ip.outputs.ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
        working-directory: ./terraform

      - name: Get VM IP
        id: get_ip
        run: |
          IP=$(terraform output -raw vm_public_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT
        working-directory: ./terraform

  ansible:
    name: Configure and Deploy
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Create inventory file
        run: |
          echo "[webservers]" > ansible/inventory.yml
          echo "${{ needs.terraform.outputs.vm_ip }} ansible_user=azureuser ansible_password=CoffeeShop@2026! ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.yml

      - name: Wait for VM to be ready
        run: |
          for i in $(seq 1 30); do
            if sshpass -p 'CoffeeShop@2026!' ssh -o StrictHostKeyChecking=no azureuser@${{ needs.terraform.outputs.vm_ip }} 'echo ready' 2>/dev/null; then
              echo "VM is ready!"
              break
            fi
            echo "Waiting for VM... attempt $i"
            sleep 10
          done

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run Ansible Playbook
        run: ansible-playbook -i ansible/inventory.yml ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"